[project]
name = "voice-agent2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wormix14", email = "nazik.pazic@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "cartesia>=4.2.0",
    "deepgram-sdk>=7.12.0",
    "fastapi>=0.142.2",
    "openai>=3.26.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
voice-agent2 = "voice_agent2:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
