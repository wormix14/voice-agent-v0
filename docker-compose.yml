services:
  db:
    image: postgres:16-alpine
    container_name: voice_agent_v2_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - voice_agent_v2_postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: voice_agent_v2_app
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ".env"
    environment:
      DATABASE_URL: "postgresql+psycopg2://app_user:app_password@db:5432/app_db"

volumes:
  voice_agent_v2_postgres_data: